  "He also says, and this is the part that stayed with me the longest, that when print reached saturation in France in the eighteenth century it made French people the same kind of people from north to south, whereas England held on to its oral tradition of common law and stayed unpredictable, and so uniformity was the message of print regardless of what was actually printed on the pages. When I think about the first texts I knew, I knew them by ear, film dialogues that my cousins would quote at each other long before any of us had watched the films, cricket commentary coming out of somebody's window in the evening, none of which was written down anywhere that I could see and all of which, I would now say, was text. So the first thing this course changed for me was a small thing that took a while to notice, which is that a text is not an object you can point at, it is more like a state that language is in, and it can be in that state without any paper being involved at all. Below I discuss the reading that got me to that point, and what I wrote on it."
];



/* Manuscript chamber: body paragraphs + glosses (glosses are Rizwan's real marginalia, reused) */
const MS = [
  {p:"Barthes mentions, almost in passing, that the Middle Ages did something to their texts that we would today probably call vandalism, they took the two most authoritative books they had, the Scriptures and Aristotle, and broke them open, filling the margins with glosses, commentaries and arguments with the text, so that a manuscript was never really a finished object but a surface that other readers kept writing on for centuries. I did not notice that I had been doing more or less the same thing until I went back through my photocopies at the end of the semester to put this portfolio together. On the first page of McLuhan there is a note in my handwriting pointing towards Viswanathan, next to the passage on IQ testing I had written Poduval's name, on Carr I had drawn a line separating what I called an information-rich environment from an interruption-rich one, and none of this is in the readings, it is all in the margins in blue ballpoint, and some of it I honestly do not remember writing."},
  {p:"This is, I think, what Unit 1 was getting at with Mezirow's idea of transformative learning. The way it was explained to us in class, a transformative learner is not somebody who adds more facts to what they already believe, it is somebody who is shaken by something, is forced to look properly at an assumption they did not know they were holding, and comes out of it seeing differently (the disorienting dilemma, then critical reflection, then a new frame of reference, in that order on the slide, though in practice it was considerably messier than that). I did not really understand it in the first week, it sounded like the kind of thing courses say about themselves. However, the margin is the one place where you can actually see it happening, because it is a record of the exact moment a sentence stopped being something I had been given and became something I was arguing with. For me the assumption that got shaken was the same one that Young's student describes and that Poduval lives through in his essay, which is that the way I had been taught to read in school was simply how reading is done. It is not. It has a history and it has a politics, and close reading, which I had always thought of as a skill I personally owned, turned out to be a syllabus, and one that was designed, at least in part, to produce a certain kind of governable person."},
  {p:"If I had to point to the day it happened it was the class on Poduval. I had underlined his line about textual analysis turning out to be tools from the colonial kitbag, mostly because it sounded good, and then it came up in the discussion and somebody asked, quite casually, whether that meant the close-reading exercises we had been doing were the same tools, and nobody in the room had a comfortable answer, including the people who usually do. I remember looking down at my copy of Swift, which was covered in annotations that I had been quietly proud of, and not being sure any more what exactly I had been trained to do. That was the dilemma, and the rest of the semester was spent working out that the answer is not to stop reading closely but to read closely while knowing where the method came from. I cannot unlearn it and to be honest I do not want to, but I can write in its margins, and the two readings on this page are the ones that taught me how."}
];



/* Print chamber: fixed, justified, no interaction */
const PRINT = [
  "Print made the work. Not the text, people were telling stories long before there was paper, but the work in the sense that Barthes uses the word, a bounded object that sits on a shelf, has one author's name on the spine and belongs to that author in a legal sense. One thing that genuinely surprised me in his essay is that copyright only properly begins with the French Revolution, and before that, as far as I understand it, a text belonged to whoever was in a position to copy it. The subject that I have just begun studying was built entirely on print's assumptions. Young's chapter shows practical criticism treating the poem as a fixed object whose value can be settled by looking at it closely enough, it shows the Leavises drawing up their canon of great works and it shows that canon borrowing its authority from a list of scriptures approved by James I, and reading all of this it struck me that the canon is fundamentally a print idea. It requires fixed texts, named authors and a shelf to put them on, and none of these existed in the oral stage.",
  "It also, as it turns out, requires an empire. Viswanathan's argument, which I am still working through, is that English literature was being taught in Indian classrooms before it was being taught in English ones, and that it was put there as a way of ruling through culture rather than through soldiers, and Poduval, writing about a century and a half later, describes his own carefully polished skills of textual analysis suddenly looking to him like tools from the colonial kitbag, which is a line that stayed with me longer than most of the readings did, because the closed page and the closed syllabus seem to me to be more or less the same thing. Swift is on this page too, partly because A Modest Proposal is the most printed thing we read this semester, a pamphlet built to be circulated and argued over, and partly because it was the reading where I did the closest reading of the whole course and then, a few weeks later, had to ask myself where that skill had come from and what it had been for. Below I discuss all four texts, with the scans of my annotated copies."
];



/* Digital chamber: fragments with links */
const DIG = [
  {p:"In 1971 Barthes was describing a kind of Text that a printed book cannot really provide, plural, with no father, produced by the reader rather than consumed by them, and Carr mentions that in the 80s and 90s some theorists (he names George Landow in particular) believed that hypertext had made this literal, that the hyperlink would finally set the reader free from the author. Then, according to Carr, the research started coming in. People who read ordinary linear text understood and remembered more than people who read text full of links, because deciding whether or not to click is a small problem to solve and it has nothing to do with reading, and so the reader who was supposed to have been liberated turned out to have what Carr calls a juggler's brain, quick at everything and deep at nothing. I found this uncomfortable, mostly because I recognised myself in it, and I suspect most people in the class did too, whether or not they said so."},
  {p:"So I do not think the digital age settles the question of who owns a text, if anything it splits the reader down the middle. On one side there is the promise that Barthes made, meaning produced in the network with the author reduced to a guest, and on the other side there is the warning from McLuhan that I wrote in my own margin, that a medium changes how we sense things steadily and without asking our permission, which I am fairly sure applies to AI as much as it applied to television, though I am a first-year student and this is a guess rather than a claim. The example that came up in class was reels, and what struck me was that nobody argued that any particular video was changing them, but everybody admitted that the format was, and that is McLuhan's point exactly, except that this time we were making it about ourselves."},
  {p:"So what did one semester of this course actually do? Mainly, I notice the medium now and not only the content. I cannot look at a page any more, whether it is printed, scanned or scrolled, without wondering what it is doing to the person holding it, and I am not sure whether that counts as wisdom yet or whether it is just a new habit I have picked up. But I write in the margins now, in a way that I did not before, and this site is in a sense one long margin. The one reading on this page is the one that made me admit that."}
];




const PAGES = ["told","copied","fixed","scattered"];
const PAGE_TITLES = {told:"Told", copied:"Copied", fixed:"Fixed", scattered:"Scattered"};
const PAGE_BLURB = {
  told:"orality, and what came before the page",
  copied:"the manuscript, the margin, and Unit 1",
  fixed:"print, the canon, and the discipline of English",
  scattered:"hypertext, attention, and reading now"
};
const PAGE_OPEN_UNUSED = {
  told:"This page is about the stage before writing, and the reading that made me take it seriously. Below, I explain in brief my response to the text and what I wrote in its margins.",
  copied:"This page is about the manuscript stage, the habit of writing in margins, and what Unit 1 asked of us under the name transformative learning. The two readings here are the ones that taught me to write back.",
  fixed:"This page is about print, and about the subject I've just started studying, which was built on print's assumptions. It holds four readings, and it's the longest page on the site. I explain my responses to each text below, along with the scans of my annotated copies.",
  scattered:"This page is about reading now, on screens, and about what one semester of this course did. It holds one reading, and it ends the portfolio."
};
const PAGE_TEXT = {told:ORAL.map(x=>({p:x})), copied:MS, fixed:PRINT.map(x=>({p:x})), scattered:DIG};

const app=document.getElementById("app");
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function setNav(k){document.querySelectorAll(".top a[data-nav]").forEach(a=>a.classList.toggle("on",a.dataset.nav===k))}
function readingsOn(p){return READINGS.filter(r=>r.page===p)}
function foot(){return `<div class="foot">Email - rizwanbinaseef@gmail.com<br>BA English and Digital Humanities, first year, 2633131</div>`}

function viewHome(){
  setNav("home");
  return `
  <h1 class="course">Text and Textualities.</h1>
  <h2>About the course</h2>
  <p>This particular course, Text and Textualities, is a course in the first semester of the BA in English and Digital Humanities, and it deals with, as the name suggests, the question of what a text is. Now on the first day I honestly assumed that this would be a fairly short question with a fairly short answer, something like a text is anything that is written down, and that we would then move on to actually reading texts. That is not what happened. I knew that a course about texts obviously belongs in a literature degree, what I did not expect was how deep it would go and how much of it would be about things that did not look like literature at all. We started, not with any text, but with the subject of English itself, where it came from as a discipline, what it was originally built to do and how it looks when you study it from an Indian classroom instead of a British one, and only after that did we come to the theory of the text as such, Barthes and his distinction between the work and the Text, and Eagleton, who spends an entire chapter refusing to define literature and then more or less admits that it cannot be done. The second half of the course followed the text through its different media, from oral cultures to the manuscript, from the manuscript to print and from print to the screen, and here McLuhan and Carr were used to ask what each of these media does to the person who is reading in it, whether they are aware of it or not. By the end of the semester the question was no longer what is a text but who decided what counts as one and through which medium, which is a very different question and, I believe, a more useful one.</p>
  <p>Unit 1 framed all of this through the idea of transformative learning, which in short means that the aim of the course was not to give us more information about texts but to disturb an assumption we already had about them and make us look at it properly. Every reading in the course was done on paper, on a photocopy, with a pen, and I have come to think this was deliberate, because it meant that whatever got disturbed left a mark somewhere. Those annotated photocopies are what this portfolio is made of. On the four pages of this site I will be discussing the readings themselves, my responses to them and what I ended up writing in their margins, which in some cases surprised me more than the readings did.</p>
  <h2>About me</h2>
  <p>My name is Rizwan Aseef and I am 19 years old, currently in my first year of the BA in English and Digital Humanities at Christ Deemed-to-be University, BGR campus. I came into this degree from a commerce background, which is not the usual route, and along with the degree I run a small marketing agency with a friend, so a good part of my week is spent reading things that are not literature at all, briefs, captions, analytics and so on. Before this semester most of my reading was for pleasure and most of it was on a phone. I mention this because it turned out to be relevant to the course: I arrived expecting Text and Textualities to be the part of the week where I read something and then said whether or not I liked it, and it turned out instead to be the course that made me question why I read the way I read in the first place.</p>
  <p>In this portfolio, I will be discussing my understanding and experience of this course. I have organised it around four stages in the life of a text, Told, Copied, Fixed and Scattered, which are also, more or less, the four stages the course took us through in order. Each page begins with my reflection on that stage, and then goes through the readings that belong to it, with my response to each text, the passages I marked and the scans of my own annotated copies, which you can scroll through on the page itself.</p>
  <ul class="areas">
    ${PAGES.map(p=>`<li><a href="#/${p}">${PAGE_TITLES[p]}</a><span>${esc(PAGE_BLURB[p])} · ${readingsOn(p).map(r=>esc(r.author)).join(", ")}</span></li>`).join("")}
  </ul>
  <p class="note">The scans on this site are my own annotated photocopies of the course readings. The texts belong to their authors and publishers; full references are given at the end of each page.</p>
  ${foot()}`;
}

function cite(r){
  const C={
    barthes:"Barthes, Roland. “From Work to Text.” 1971. <i>Image–Music–Text</i>, translated by Stephen Heath, Fontana, 1977.",
    carr:"Carr, Nicholas. “The Juggler's Brain.” <i>Phi Delta Kappan</i>, vol. 92, no. 4, 2010, pp. 8–14. Excerpted from <i>The Shallows</i>, W. W. Norton, 2010.",
    whatistext:"Eagleton, Terry. “What is Literature?” <i>Literary Theory: An Introduction</i>, Blackwell, 1983, pp. 1–16.",
    mcluhan:"McLuhan, Marshall. “The Medium is the Message.” <i>Understanding Media: The Extensions of Man</i>, 1964.",
    poduval:"Poduval, Satish. “To Be in Eng. Lit., Now That…: The Voyage Out.” <i>Subject to Change: Teaching Literature in the Nineties</i>, edited by Susie Tharu, Orient Longman, 1998, pp. 143–58.",
    swift:"Swift, Jonathan. <i>A Modest Proposal</i>. 1729. Project Gutenberg, ebook 1080.",
    viswanathan:"Viswanathan, Gauri. <i>Masks of Conquest: Literary Study and British Rule in India</i>. Columbia UP, 1989.",
    young:"Young, Tory. “Reading.” <i>Studying English Literature: A Practical Guide</i>, Cambridge UP, 2008, pp. 24–35."
  };
  return C[r.id]||"";
}

function readingBlock(r){
  return `
  ${r.drive?`<div class="scan"><iframe src="${r.drive.replace('/view','/preview')}" title="Annotated scan of ${esc(r.title)}" loading="lazy" allow="autoplay"></iframe></div>
  <p class="small soft">My annotated copy. Scroll through it here or <a href="${r.drive}" target="_blank" rel="noopener">open it full size</a>.</p>`:""}
  <h2 id="${r.id}">${esc(r.title)}</h2>
  <p class="small soft">${esc(r.author)}, ${esc(r.year)}</p>
  <p>${esc(r.what)}</p>
  ${r.response?`<p>${esc(r.response)}</p>`:""}
  <div class="sheet"><div class="src">Passages I marked, with what I wrote beside them</div>
    ${r.passages.map(p=>`<div class="passage"><p>${esc(p.text)}</p>${p.pen?`<div class="mnote pen">${esc(p.pen)}</div>`:""}</div>`).join("")}
  </div>`;
}

function viewPage(page){
  if(!PAGES.includes(page)) page="told";
  setNav(page);
  const i=PAGES.indexOf(page), rs=readingsOn(page);
  const prev=i>0?PAGES[i-1]:null, next=i<PAGES.length-1?PAGES[i+1]:null;
  const conclusion = page==="scattered" ? `
  <div class="label">Conclusion</div>
  <p>I think it is finally time to end this portfolio, which I put together over the past week by going back through every photocopy from the semester and reading what I had written in the margins, a good deal of which I did not remember writing and some of which I would not write now. I came into this degree from a commerce background and I expected this course to be the part of the week where I read something and said whether I liked it, and it was not that. It was the course that made me notice the page I was holding, and then the syllabus that page had come from, and then the medium that the syllabus took for granted, and I do not think I read anything the same way now, including the things I read for work, which was not something I expected a literature course to do.</p>
  <p>This concludes my portfolio for the course Text and Textualities, which turned out to be a much deeper and stranger course than its title suggested. My thanks to Christ Deemed-to-be University and to Prof. Renu Elizabeth, whose classes are the reason there is anything written in these margins at all.</p>` : "";
  return `
  <h1>${PAGE_TITLES[page]}</h1>
  ${PAGE_TEXT[page].map(x=>`<p>${esc(x.p)}</p>`).join("")}
  <p class="note">(The scans below are my own annotated photocopies. The texts belong to their authors.)</p>
  ${rs.map(readingBlock).join("<hr>")}
  ${conclusion}
  <div class="label">References</div>
  ${rs.map(r=>`<p class="small">${cite(r)}</p>`).join("")}
  <div class="prevnext"><span>${prev?`<a href="#/${prev}">← ${PAGE_TITLES[prev]}</a>`:""}</span><span>${next?`<a href="#/${next}">${PAGE_TITLES[next]} →</a>`:""}</span></div>
  ${foot()}`;
}

function render(){
  const h=location.hash.replace(/^#\/?/,"");
  const [a,b]=h.split("/");
  let html;
  if(!a) html=viewHome();
  else if(PAGES.includes(a)) html=viewPage(a);
  else if(a==="reflection") html=viewPage({oral:"told",manuscript:"copied",print:"fixed",digital:"scattered"}[b]||"told");
  else if(a==="reading"){const r=READINGS.find(x=>x.id===b); html=viewPage(r?r.page:"told");}
  else html=viewHome();
  app.innerHTML=html; window.scrollTo({top:0});
}
window.addEventListener("hashchange",render); render();
</script>
</body>
</html>
